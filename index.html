<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robux Portalı</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Siyah ve Neon Beyaz Tema */
        body {
            background-color: #0d0d0d;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            padding: 80px 20px 20px 20px;
        }

        /* Üst Menü / Header */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background-color: #121212;
            border-bottom: 2px solid #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            z-index: 100;
        }

        .btn-add {
            background-color: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
            transition: 0.2s;
        }

        .btn-add:hover {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        .robux-display {
            display: flex;
            align-items: center;
            background-color: #000000;
            padding: 6px 15px;
            border-radius: 20px;
            border: 2px solid #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.3);
        }

        .robux-icon {
            color: #ffffff;
            margin-right: 8px;
            font-size: 16px;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
        }

        .robux-amount {
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        /* Jeton Değer Tablosu (Neon Beyaz Çerçeveli) */
        .rates-card {
            background-color: #121212;
            border: 2px solid #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .rates-card h3 {
            text-align: center;
            margin-bottom: 15px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6);
        }

        .rate-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 5px;
            border-bottom: 1px dashed #333;
            font-weight: 600;
            font-size: 15px;
        }

        .rate-row:last-child {
            border-bottom: none;
        }

        .rate-left, .rate-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .token-icon { color: #a3a3a3; }
        .row-rbx-icon { color: #ffffff; text-shadow: 0 0 4px #fff; }

        /* Ana Panel / Gönderim Ekranı */
        .main-card {
            background-color: #121212;
            border: 2px solid #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            padding: 30px 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
        }

        /* Canlı Roblox Profil Alanı */
        .profile-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
            min-height: 100px;
            justify-content: center;
        }

        .avatar-container {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            background-color: #000;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
            display: none; /* İsim girilene kadar görünmez */
            overflow: hidden;
            justify-content: center;
            align-items: center;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #ffffff;
            font-size: 18px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 12px 12px 42px;
            background-color: #000000;
            border: 2px solid #333;
            border-radius: 6px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #ffffff;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .btn-send {
            width: 100%;
            background-color: #ffffff;
            color: #000000;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            transition: 0.2s;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .btn-send:hover {
            background-color: #0d0d0d;
            color: #ffffff;
            border: 2px solid #ffffff;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        /* Büyük Başarı Mesajı Kutusu */
        #successMessage {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #000000;
            color: #ffffff;
            padding: 25px 30px;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            z-index: 1000;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            border: 3px solid #ffffff;
            width: 85%;
            max-width: 380px;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -60%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
    </style>
</head>
<body>

    <div class="header">
        <button class="btn-add" onclick="addRobux()">RBX ADD</button>
        <div class="robux-display">
            <i class="fa-solid fa-hexagon-nodes-alt robux-icon">⬡</i>
            <span class="robux-amount" id="robuxBalance">0</span>
        </div>
    </div>

    <div class="rates-card">
        <h3><i class="fa-solid fa-circle-info"></i> Jeton / Robux Değerleri</h3>
        
        <div class="rate-row">
            <div class="rate-left"><i class="fa-solid fa-ticket token-icon"></i> 10 Jeton</div>
            <div class="rate-right">= 1,000 <i class="fa-solid fa-hexagon-nodes-alt row-rbx-icon">⬡</i></div>
        </div>
        
        <div class="rate-row">
            <div class="rate-left"><i class="fa-solid fa-ticket token-icon"></i> 20 Jeton</div>
            <div class="rate-right">= 3,000 <i class="fa-solid fa-hexagon-nodes-alt row-rbx-icon">⬡</i></div>
        </div>
        
        <div class="rate-row">
            <div class="rate-left"><i class="fa-solid fa-ticket token-icon"></i> 50 Jeton</div>
            <div class="rate-right">= 10,000 <i class="fa-solid fa-hexagon-nodes-alt row-rbx-icon">⬡</i></div>
        </div>
        
        <div class="rate-row" style="border-color: #fff;">
            <div class="rate-left"><i class="fa-solid fa-ticket-simple"></i> 80 ve üzeri Jeton</div>
            <div class="rate-right" style="text-shadow: 0 0 5px #fff;">= İstediğiniz Kadar. <i class="fa-solid fa-star"></i></div>
        </div>
    </div>

    <div class="main-card">
        
        <div class="profile-preview">
            <div id="avatarBox" class="avatar-container">
                <img id="avatarDisplay" class="avatar-img" src="" alt="Roblox Avatar">
            </div>
        </div>
        
        <div class="input-group">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="targetUser" placeholder="Roblox Kullanıcı Adı" autocomplete="off" oninput="updateAvatar()">
        </div>

        <div class="input-group">
            <i class="fa-solid fa-hexagon-nodes-alt" style="color: #ffffff;"></i>
            <input type="number" id="sendAmount" placeholder="Gönderilecek Robux" min="1">
        </div>

        <button class="btn-send" onclick="sendRobux()">
            <i class="fa-solid fa-paper-plane"></i> Gönder
        </button>
    </div>

    <div id="successMessage"></div>

    <script>
        // Sayfa yüklendiğinde hafızadaki Robux miktarını çek
        let currentRobux = parseInt(localStorage.getItem('robuxCount')) || 0;
        
        const balanceElement = document.getElementById('robuxBalance');
        balanceElement.innerText = currentRobux.toLocaleString();

        // Kullanıcı adı yazıldıkça avatarı anlık güncelleyen fonksiyon
        function updateAvatar() {
            const username = document.getElementById('targetUser').value.trim();
            const avatarBox = document.getElementById('avatarBox');
            const avatarImg = document.getElementById('avatarDisplay');
            
            if(username.length > 2) {
                // Tarayıcı engeline takılmayan güncel avatar buster API'si
                avatarImg.src = `https://www.roblox.com/avatar-thumbnail/image?username=${encodeURIComponent(username)}&width=150&height=150&format=png`;
                avatarBox.style.display = 'flex';
            } else {
                avatarBox.style.display = 'none';
            }
        }

        // RBX ADD Fonksiyonu
        function addRobux() {
            let amount = prompt("Eklemek istediğiniz Robux miktarını yazın:");
            if (amount === null || amount.trim() === "") return;
            
            let parsedAmount = parseInt(amount);

            if (!isNaN(parsedAmount) && parsedAmount >= 0) {
                currentRobux = parsedAmount;
                localStorage.setItem('robuxCount', currentRobux);
                balanceElement.innerText = currentRobux.toLocaleString();
            } else {
                alert("Lütfen geçerli bir sayı girin!");
            }
        }

        // Gönder Buton Fonksiyonu
        function sendRobux() {
            const usernameInput = document.getElementById('targetUser');
            const username = usernameInput.value.trim();
            const sendAmountInput = document.getElementById('sendAmount');
            const avatarBox = document.getElementById('avatarBox');
            let sendAmount = parseInt(sendAmountInput.value);

            if (username === "") {
                alert("Lütfen bir kullanıcı adı girin!");
                return;
            }

            if (isNaN(sendAmount) || sendAmount <= 0) {
                alert("Lütfen geçerli bir miktar girin!");
                return;
            }

            if (sendAmount > currentRobux) {
                alert("Yetersiz Robux bakiyesi!");
                return;
            }

            // Hesaplama ve Kayıt
            currentRobux -= sendAmount;
            localStorage.setItem('robuxCount', currentRobux);
            balanceElement.innerText = currentRobux.toLocaleString();

            // Büyük Ekran Başarı Mesajı
            const msgBox = document.getElementById('successMessage');
            msgBox.innerHTML = `Robux "${username}" Adlı Kişiye Başarıyla Gönderildi !`;
            msgBox.style.display = 'block';

            // 3 saniye sonra kapat ve temizle
            setTimeout(() => {
                msgBox.style.display = 'none';
            }, 3000);
            
            sendAmountInput.value = "";
            usernameInput.value = "";
            avatarBox.style.display = 'none';
        }
    </script>
</body>
</html>
