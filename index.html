<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RBX Sender</title>

<style>

body{
    margin:0;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

.topbar{
    height:70px;
    background:#050505;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 15px;
    border-bottom:1px solid #ffffff33;
}

.rbx-btn{
    background:#fff;
    color:#000;
    border:none;
    padding:12px 18px;
    border-radius:12px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 15px #fff;
}

.robux-box{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:22px;
    font-weight:bold;
}

.robux-logo{
    width:34px;
    filter:brightness(100);
}

.container{
    width:90%;
    max-width:420px;
    margin:auto;
    margin-top:40px;
    background:#050505;
    padding:25px;
    border-radius:20px;
    border:1px solid #ffffff22;
    box-shadow:0 0 25px #ffffff11;
}

.label{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    font-size:17px;
}

.icon{
    width:24px;
    filter:invert(1);
}

.input-box{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    background:#0e0e0e;
    border:1px solid #ffffff22;
    color:#fff;
    border-radius:12px;
    font-size:16px;
    box-sizing:border-box;
}

input:focus{
    outline:none;
    box-shadow:0 0 10px #fff;
}

.avatar-box{
    text-align:center;
    margin-top:20px;
}

.avatar-box img{
    width:150px;
    border-radius:15px;
    border:2px solid #fff;
    box-shadow:0 0 20px #fff;
    display:none;
}

.usernameText{
    margin-top:10px;
    font-size:20px;
    font-weight:bold;
    display:none;
}

.send-btn{
    width:100%;
    padding:15px;
    border:none;
    border-radius:14px;
    background:#fff;
    color:#000;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    margin-top:25px;
    box-shadow:0 0 15px #fff;
}

.notify{
    position:fixed;
    top:20px;
    left:50%;
    transform:translateX(-50%);
    background:#fff;
    color:#000;
    padding:15px 25px;
    border-radius:15px;
    font-weight:bold;
    box-shadow:0 0 20px #fff;
    display:none;
    z-index:999;
}

</style>
</head>
<body>

<div class="notify" id="notify">
Robux Gönderildi
</div>

<div class="topbar">

<button class="rbx-btn" onclick="addRobux()">
RBX ADD
</button>

<div class="robux-box">
<img class="robux-logo" src="https://cdn-icons-png.flaticon.com/512/5968/5968917.png">
<span id="robuxAmount">0</span>
</div>

</div>

<div class="container">

<div class="input-box">

<div class="label">
<img class="icon" src="https://cdn-icons-png.flaticon.com/512/1077/1077114.png">
<span>Kullanıcı İsmi</span>
</div>

<input type="text" id="username" placeholder="Roblox kullanıcı adı">

</div>

<div class="input-box">

<div class="label">
<img class="icon" src="https://cdn-icons-png.flaticon.com/512/5968/5968917.png">
<span>Gönderilecek Robux</span>
</div>

<input type="number" id="sendAmount" placeholder="Miktar">

</div>

<div class="avatar-box">

<img id="avatar">

<div class="usernameText" id="profileName"></div>

</div>

<button class="send-btn" onclick="sendRobux()">
✈ Gönder
</button>

</div>

<script>

let robux = localStorage.getItem("robux");

if(robux === null){
    robux = 0;
}

document.getElementById("robuxAmount").innerText = robux;

function addRobux(){

    let amount = prompt("Kaç Robux?");

    if(amount && !isNaN(amount)){

        robux = parseInt(amount);

        localStorage.setItem("robux", robux);

        document.getElementById("robuxAmount").innerText = robux;
    }
}

function showNotify(){

    let notify = document.getElementById("notify");

    notify.style.display = "block";

    setTimeout(() => {

        notify.style.display = "none";

    }, 3000);
}

function sendRobux(){

    let amount = parseInt(document.getElementById("sendAmount").value);

    if(isNaN(amount) || amount <= 0){
        return;
    }

    if(amount > robux){
        return;
    }

    robux -= amount;

    localStorage.setItem("robux", robux);

    document.getElementById("robuxAmount").innerText = robux;

    showNotify();
}

document.getElementById("username").addEventListener("input", async function(){

    let username = this.value;

    if(username.length < 3){
        return;
    }

    try{

        let response = await fetch("https://users.roblox.com/v1/usernames/users",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                usernames:[username],
                excludeBannedUsers:false
            })
        });

        let data = await response.json();

        if(data.data.length > 0){

            let userId = data.data[0].id;

            let avatar = document.getElementById("avatar");

            avatar.src = `https://www.roblox.com/headshot-thumbnail/image?userId=${userId}&width=420&height=420&format=png`;

            avatar.style.display = "block";

            document.getElementById("profileName").style.display = "block";

            document.getElementById("profileName").innerText = username;
        }

    }catch(err){
        console.log(err);
    }

});

</script>

</body>
</html>
